name: macOS compile check

# Builds the app with the newest Xcode the hosted runner has. Where that SDK predates macOS 27, the two calls only macOS
# 27 has stand in as the limits they return today and the build targets the SDK's own release: it is a compile check of
# everything else, not a build to run.
on:
  push:
  pull_request:

jobs:
  build:
    name: Build (Debug, unsigned)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          xcrun --show-sdk-version
      - name: Build
        run: |
          sdk=$(xcrun --show-sdk-version)
          target=27.0
          if [ "${sdk%%.*}" -lt 27 ]; then
            sed -i '' \
              -e 's/Int(VTLowLatencyFrameInterpolationConfiguration.__maximumDimension(forSpatialScaleFactor: 1))/1920/' \
              -e 's/Int(VTLowLatencyFrameInterpolationConfiguration.__maximumPixelCount(forSpatialScaleFactor: 1))/2_073_600/' \
              MetalGoose/Engine/NeuralInterpolator.swift
            target="$sdk"
          fi
          xcodebuild build -scheme MetalGoose -project MetalGoose.xcodeproj -configuration Debug \
            CODE_SIGNING_ALLOWED=NO MACOSX_DEPLOYMENT_TARGET="$target" > build.log 2>&1
          status=$?
          grep -E "(error|warning): " build.log | grep -v "deployment target" | sort -u | head -150
          tail -3 build.log
          exit $status
      - name: Probe the GPU
        if: always()
        run: |
          MTL_DEBUG_LAYER=1 swift .github/probe/MetalProbe.swift 2>&1 | grep PROBE || true
      - name: VideoToolbox headers
        if: always()
        run: |
          headers="$(xcrun --show-sdk-path)/System/Library/Frameworks/VideoToolbox.framework/Headers"
          for h in VTFrameProcessor_LowLatencySuperResolutionScaler.h VTFrameProcessorFrame.h; do
            echo "=== $h"; grep -v -E "^\s*$|^//|^\s*\*|^/\*" "$headers/$h" | head -150 || true
          done
      - name: Upscale quality
        if: always()
        run: |
          mkdir -p kodak
          for i in $(seq -w 1 24); do
            curl -sfL --retry 3 -o "kodak/kodim$i.png" "https://r0k.us/graphics/kodak/kodak/kodim$i.png" || rm -f "kodak/kodim$i.png"
          done
          swiftc -O .github/probe/UpscaleQuality.swift -o upscale && ./upscale
          echo "=== with VideoToolbox super resolution"
          swiftc -O -D VT_SR .github/probe/UpscaleQuality.swift -o upscale-vt 2>&1 | grep -E "error" | head -20
          [ -x upscale-vt ] && ./upscale-vt | grep -E "VT|VideoToolbox" || true
