name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyze
    # macOS 27 with Xcode 27 and the macOS 27 SDK, which the app is built against.
    runs-on: xcode-27

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Metal toolchain
        # The Metal compiler is a component Xcode downloads separately; a fresh runner may not have it.
        run: |
          if ! xcodebuild -showComponent MetalToolchain 2>/dev/null | grep -q "Status: installed"; then
            xcodebuild -downloadComponent MetalToolchain
          fi
      - name: Build
        run: |
          set -o pipefail
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if [ "${sdk_version%%.*}" -lt 27 ]; then
            echo "::error::The app build requires the macOS 27 SDK; this runner has $sdk_version."
            exit 1
          fi
          xcodebuild clean build analyze \
            -scheme MetalGoose \
            -project MetalGoose.xcodeproj \
            CODE_SIGNING_ALLOWED=NO
