name: Upscale quality

# Run by hand (Actions > Upscale quality > Run workflow): scores MetalFX spatial and the app's sharpening, in either
# order, against the original images on the hosted runner's GPU. Quality only — the runner's GPU is virtual, so its
# times mean nothing, and it has no Neural Engine, so VideoToolbox's super resolution cannot run there (see the probe).
on:
  workflow_dispatch:

jobs:
  measure:
    name: Measure
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test images
        run: |
          mkdir -p kodak
          for i in $(seq -w 1 24); do
            curl -sfL --retry 3 -o "kodak/kodim$i.png" "https://r0k.us/graphics/kodak/kodak/kodim$i.png" || rm -f "kodak/kodim$i.png"
          done
          ls kodak | wc -l
      - name: Measure
        run: |
          swiftc -O .github/probe/UpscaleQuality.swift -o upscale
          ./upscale
