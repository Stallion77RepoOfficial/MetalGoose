name: Logic tests

# The engine's decisions that need no Metal or window server, built and tested on their own (LogicTests/Package.swift).
# The app itself needs the macOS 27 SDK, which the hosted runners may not have yet.
on:
  push:
  pull_request:

jobs:
  test:
    name: swift test
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path LogicTests
